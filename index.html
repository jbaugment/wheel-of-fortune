<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheel of Fortune Slot Machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>🎰 Wheel of Fortune 🎡</h1>
      <button
        id="sound-toggle"
        class="sound-toggle"
        aria-label="Toggle sound"
        type="button"
      >
        🔊 Sound: ON
      </button>
    </header>

    <main class="stage">
      <section class="panel slot-panel" aria-label="Slot machine">
        <div class="marquee">
          <span class="marquee-light"></span>
          <span class="marquee-light"></span>
          <span class="marquee-light"></span>
          <h2 class="marquee-title">Wheel of Fortune</h2>
          <span class="marquee-light"></span>
          <span class="marquee-light"></span>
          <span class="marquee-light"></span>
        </div>
        <div class="reels-bezel">
          <div class="reels-window">
            <canvas
              id="reels-canvas"
              width="540"
              height="240"
              aria-label="Slot reels"
            ></canvas>
          </div>
        </div>
        <button id="spin-reels-btn" class="slot-spin-btn" type="button">
          <span class="slot-spin-btn-inner">SPIN</span>
        </button>
        <div class="info">
          <div id="reels-status" class="status"></div>
        </div>
      </section>

      <section class="panel wheel-panel" aria-label="Bonus wheel">
        <h2>Bonus Wheel</h2>
        <canvas
          id="wheel-canvas"
          width="520"
          height="520"
          aria-label="Bonus wheel"
        ></canvas>
        <button
          id="spin-wheel-btn"
          class="big-btn bonus"
          type="button"
          disabled
        >
          Spin Wheel
        </button>
        <div class="info">
          <div>Last prize: <strong id="last-prize">—</strong></div>
        </div>
      </section>
    </main>

    <div
      id="prize-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="prize-modal-title"
    >
      <div class="modal-card">
        <h2 id="prize-modal-title">You won!</h2>
        <p class="prize-label" id="prize-modal-label">—</p>
        <button id="prize-modal-close" class="big-btn" type="button">
          Awesome
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
